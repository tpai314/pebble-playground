<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Address Details — Rippling</title>
  <link rel="stylesheet" href="https://static-assets.ripplingcdn.com/webapp-static/rippling-fonts-rebrand.css">
  <style>
    @font-face { font-display: swap; font-family: "BaselGrotesk"; src: url("https://static-assets.ripplingcdn.com/pebble/fonts/BaselGrotesk/Basel-Grotesk-Regular.woff2") format("woff2"); font-weight: 400; }
    @font-face { font-display: swap; font-family: "BaselGrotesk"; src: url("https://static-assets.ripplingcdn.com/pebble/fonts/BaselGrotesk/Basel-Grotesk-Book.woff2") format("woff2"); font-weight: 500; }
    @font-face { font-display: swap; font-family: "BaselGrotesk"; src: url("https://static-assets.ripplingcdn.com/pebble/fonts/BaselGrotesk/Basel-Grotesk-Medium.woff2") format("woff2"); font-weight: 600; }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --color-primary: #6B2D7B;
      --color-primary-hover: #5A2568;
      --color-primary-container: #ede0f0;
      --color-on-primary: #fff;
      --color-secondary: #1b6cd9;
      --color-surface: #fff;
      --color-surface-dim: #f7f5f3;
      --color-surface-bright: #fbfafb;
      --color-on-surface: #182433;
      --color-on-surface-variant: #6b7280;
      --color-outline: #d1d1d6;
      --color-outline-variant: #e5e5ea;
      --color-neutral-container: #f2f2f7;
      --color-on-neutral-container: #3a3a3c;
      --color-on-surface-inverse: #fff;
      --color-surface-inverse: #182433;
      --color-success: #16a34a;
      --color-success-container: #dcfce7;
      --color-warning: #d97706;
      --color-warning-container: #fef3c7;
      --color-error: #dc2626;
      --color-error-container: #fee2e2;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.06);
      --shadow-md: 0 2px 8px rgba(0,0,0,0.08);
      --shape-corner-sm: 4px;
      --shape-corner-md: 8px;
      --shape-corner-lg: 12px;
      --shape-corner-xl: 16px;
      --shape-corner-full: 9999px;
      --sidebar-width: 200px;
      --topbar-height: 56px;
    }

    body {
      font-family: "BaselGrotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--color-on-surface); background: var(--color-surface);
      display: flex; min-height: 100vh; font-size: 14px; line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* ─── Sidebar ─── */
    .sidebar {
      width: var(--sidebar-width); background: var(--color-surface-inverse); color: #fff;
      display: flex; flex-direction: column; flex-shrink: 0;
      position: fixed; top: 0; left: 0; bottom: 0; z-index: 10;
    }
    .sidebar-logo { display: flex; align-items: center; gap: 10px; padding: 20px 20px 24px; font-size: 17px; font-weight: 600; letter-spacing: -0.2px; }
    .logo-icon { width: 28px; height: 28px; background: var(--color-primary); border-radius: var(--shape-corner-md); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; }
    .sidebar-section-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; color: rgba(255,255,255,0.38); padding: 0 20px 8px; }
    .sidebar-nav { list-style: none; margin-bottom: 24px; }
    .sidebar-nav li a { display: flex; align-items: center; gap: 10px; padding: 8px 20px; color: rgba(255,255,255,0.65); text-decoration: none; font-size: 14px; transition: background 0.12s, color 0.12s; }
    .sidebar-nav li a:hover { background: rgba(255,255,255,0.06); color: #fff; }
    .sidebar-nav li a.active { background: rgba(255,255,255,0.1); color: #fff; font-weight: 500; }
    .nav-icon { width: 18px; height: 18px; opacity: 0.65; flex-shrink: 0; }

    /* ─── Main ─── */
    .main { margin-left: var(--sidebar-width); flex: 1; display: flex; flex-direction: column; min-height: 100vh; }

    /* ─── Topbar ─── */
    .topbar { height: var(--topbar-height); background: var(--color-surface); border-bottom: 1px solid var(--color-outline-variant); display: flex; align-items: center; justify-content: center; padding: 0 24px; position: sticky; top: 0; z-index: 5; }
    .search-box { display: flex; align-items: center; gap: 8px; background: var(--color-neutral-container); border-radius: var(--shape-corner-md); padding: 8px 16px; width: 260px; color: var(--color-on-surface-variant); font-size: 13px; }
    .topbar-right { position: absolute; right: 24px; display: flex; align-items: center; gap: 16px; }
    .topbar-icon { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; color: var(--color-on-surface-variant); cursor: pointer; border-radius: var(--shape-corner-md); }
    .topbar-icon:hover { background: var(--color-neutral-container); }
    .pb-avatar { width: 32px; height: 32px; border-radius: var(--shape-corner-full); background: var(--color-primary); color: var(--color-on-primary); font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center; }

    /* ─── Page header ─── */
    .page-header { padding: 28px 32px 0; }
    .page-title { font-size: 22px; font-weight: 600; margin-bottom: 4px; }
    .page-subtitle { font-size: 14px; color: var(--color-on-surface-variant); margin-bottom: 24px; }

    /* ─── Content ─── */
    .content-area { padding: 0 32px 40px; max-width: 720px; }

    /* ─── Address card ─── */
    .address-card {
      border: 1px solid var(--color-outline-variant);
      border-radius: var(--shape-corner-xl);
      background: var(--color-surface);
      box-shadow: var(--shadow-sm);
      margin-bottom: 24px;
      overflow: hidden;
    }
    .address-card-header {
      display: flex; align-items: center; gap: 10px;
      padding: 18px 20px;
      border-bottom: 1px solid var(--color-outline-variant);
      background: var(--color-surface-dim);
    }
    .address-card-icon {
      width: 32px; height: 32px; border-radius: var(--shape-corner-md);
      background: var(--color-primary-container); color: var(--color-primary);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .address-card-title { font-size: 15px; font-weight: 600; }
    .address-card-body { padding: 20px; }

    /* ─── Form fields ─── */
    .form-row { display: flex; gap: 16px; margin-bottom: 16px; }
    .form-row:last-child { margin-bottom: 0; }
    .form-group { flex: 1; display: flex; flex-direction: column; gap: 4px; }
    .form-group.full { flex: 1 1 100%; }

    .form-label {
      font-size: 12.5px; font-weight: 500; color: var(--color-on-surface);
    }
    .form-label .required { color: var(--color-error); margin-left: 2px; }

    .form-input, .form-select {
      width: 100%; padding: 9px 12px;
      border: 1px solid var(--color-outline);
      border-radius: var(--shape-corner-md);
      font-size: 13.5px; font-family: inherit;
      color: var(--color-on-surface);
      background: var(--color-surface);
      outline: none; transition: border-color 0.12s, box-shadow 0.12s;
      appearance: none; -webkit-appearance: none;
    }
    .form-input:focus, .form-select:focus {
      border-color: var(--color-primary);
      box-shadow: 0 0 0 2px rgba(107,45,123,0.15);
    }
    .form-input::placeholder { color: var(--color-on-surface-variant); }

    .form-select {
      background-image: url("data:image/svg+xml,%3Csvg width='12' height='12' viewBox='0 0 24 24' fill='none' stroke='%236b7280' stroke-width='2.5' xmlns='http://www.w3.org/2000/svg'%3E%3Cpolyline points='6 9 12 15 18 9'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 12px center;
      padding-right: 32px; cursor: pointer;
    }

    /* ─── Checkbox ─── */
    .checkbox-row {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 24px;
      cursor: pointer; user-select: none;
    }
    .checkbox-input {
      width: 18px; height: 18px; border-radius: var(--shape-corner-sm);
      border: 1.5px solid var(--color-outline); background: var(--color-surface);
      appearance: none; -webkit-appearance: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.12s, border-color 0.12s; flex-shrink: 0;
      position: relative;
    }
    .checkbox-input:checked {
      background: var(--color-primary); border-color: var(--color-primary);
    }
    .checkbox-input:checked::after {
      content: '';
      width: 5px; height: 9px;
      border: solid #fff; border-width: 0 2px 2px 0;
      transform: rotate(45deg); position: absolute; top: 2px;
    }
    .checkbox-input:focus-visible {
      box-shadow: 0 0 0 2px rgba(107,45,123,0.25);
    }
    .checkbox-label { font-size: 13.5px; color: var(--color-on-surface); }

    /* ─── Permanent address visibility ─── */
    .permanent-address { transition: opacity 0.2s, max-height 0.3s; }
    .permanent-address.hidden {
      opacity: 0; max-height: 0; overflow: hidden; margin-bottom: 0; pointer-events: none;
    }
    .permanent-address.visible {
      opacity: 1; max-height: 600px;
    }

    /* ─── Buttons ─── */
    .pb-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 9px 20px; border-radius: var(--shape-corner-md);
      font-size: 13.5px; font-weight: 500; cursor: pointer;
      border: none; transition: all 0.12s; font-family: inherit;
    }
    .pb-btn-filled { background: var(--color-primary); color: var(--color-on-primary); }
    .pb-btn-filled:hover { background: var(--color-primary-hover); }
    .pb-btn-outline { background: transparent; color: var(--color-on-surface); border: 1px solid var(--color-outline); }
    .pb-btn-outline:hover { border-color: var(--color-on-surface-variant); background: var(--color-neutral-container); }

    .form-actions { display: flex; gap: 10px; margin-top: 32px; }
  </style>
</head>
<body>

<div class="main">

    <div class="search-box">

    <div class="topbar-right">
      <div class="topbar-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></div>
      <div class="pb-avatar">AP</div>
    </div>
  </header>

  <div class="page-header">
    <h1 class="page-title">Address Details</h1>
    <p class="page-subtitle">Provide your current and permanent residential address in India.</p>
  </div>

  <div class="content-area">

    <!-- ═══ Current Address ═══ -->
    <div class="address-card">
      <div class="address-card-header">
        <div class="address-card-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
        </div>
        <span class="address-card-title">Current Address</span>
      </div>
      <div class="address-card-body">
        <div class="form-row">
          <div class="form-group full">
            <label class="form-label">Address Line 1<span class="required">*</span></label>
            <input type="text" class="form-input" placeholder="House / Flat No., Building Name, Street">
          </div>
        </div>
        <div class="form-row">

            <input type="text" class="form-input" placeholder="Area, Colony, Landmark">

        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">City / Town<span class="required">*</span></label>
            <input type="text" class="form-input" placeholder="e.g. Bengaluru">
          </div>
          <div class="form-group">
            <label class="form-label">PIN Code<span class="required">*</span></label>
            <input type="text" class="form-input" placeholder="e.g. 560001" maxlength="6" inputmode="numeric">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">State<span class="required">*</span></label>
            <select class="form-select" id="currentState">
              <option value="" disabled selected>Select state</option>
              <option>Andhra Pradesh</option>
              <option>Arunachal Pradesh</option>
              <option>Assam</option>

              <option>Himachal Pradesh</option>
              <option>Jharkhand</option>

              <option>Odisha</option>
              <option>Punjab</option>
              <option>Rajasthan</option>
              <option>Sikkim</option>
              <option>Tamil Nadu</option>
              <option>Telangana</option>
              <option>Tripura</option>
              <option>Uttar Pradesh</option>
              <option>Uttarakhand</option>
              <option>West Bengal</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Country</label>
            <input type="text" class="form-input" value="India" disabled style="background:var(--color-neutral-container); color:var(--color-on-surface-variant);">
          </div>
        </div>
      </div>
    </div>

    <!-- ═══ Same address checkbox ═══ -->
    <label class="checkbox-row" for="sameAddress">
      <input type="checkbox" class="checkbox-input" id="sameAddress" checked>
      <span class="checkbox-label">My permanent address is same as my current address</span>
    </label>

    <!-- ═══ Permanent Address ═══ -->
    <div class="address-card permanent-address hidden" id="permanentAddressCard">
      <div class="address-card-header">
        <div class="address-card-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        </div>
        <span class="address-card-title">Permanent Address</span>
      </div>
      <div class="address-card-body">
        <div class="form-row">
          <div class="form-group full">
            <label class="form-label">Address Line 1<span class="required">*</span></label>
            <input type="text" class="form-input" placeholder="House / Flat No., Building Name, Street">

        </div>
        <div class="form-row">
          <div class="form-group full">
            <label class="form-label">Address Line 2</label>

          </div>

        <div class="form-row">

            <input type="text" class="form-input" placeholder="e.g. 800001" maxlength="6" inputmode="numeric">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">

              <option>Punjab</option>

    <div class="form-actions">
      <button class="pb-btn pb-btn-filled">Save & Continue</button>
      <button class="pb-btn pb-btn-outline">Cancel</button>
    </div>
  </div>
</div>

<script>
  const checkbox = document.getElementById('sameAddress');
  const permanentCard = document.getElementById('permanentAddressCard');

  checkbox.addEventListener('change', () => {
    if (checkbox.checked) {
      permanentCard.classList.remove('visible');
      permanentCard.classList.add('hidden');
    } else {
      permanentCard.classList.remove('hidden');
      permanentCard.classList.add('visible');
    }
  });
</script>
</body>
